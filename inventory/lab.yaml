# =============================================================================
#  VCF 9.1 Lab inventory  —  明文, 非敏感資料 (IP/FQDN/VLAN/datastore)
#  密碼 / token 放 inventory/secrets/lab.yaml
#
#  ⚠ 對齊「實機」: domain = home.lab, mgmt = 10.0.0.0/23 (10.0.0.x + 10.0.1.x 同段).
#     值來自實機 DNS (10.0.0.200 / home.lab zone) 與 autodeploy/add-dns 腳本.
#     (舊版本寫 lab.com + 切開 10.0.1/10.0.2/10.0.3 是理想化、沒對到實機, 已更正.)
# =============================================================================

lab:
  name: vcf-m02
  domain: home.lab

# -------- 物理 / 基礎服務 (lab 外圍) ---------------------------------------
infra:
  # 外層 vCenter (跑 nested 的那台實體 vCenter)
  outer_vcenter:
    fqdn: labvc.lab.com                 # 實測憑證 CN=labvc.lab.com (外層在 lab.com; nested VCF 才是 home.lab)
    ip:   10.0.0.101
    user: administrator@vsphere.local
    # 部署 nested VM 的目標 (Deploy-NestedESXi-And-Installer.ps1 用)
    datacenter: Datacenter
    cluster:    Cluster
    datastore:  vsanDatastore
    portgroup:  Trunk-Nobinding        # VLAN Trunk portgroup (nested 用)
    vm_folder:  VCF

  # AD + DNS + jumpbox (這台機; 也是跑所有 PowerShell 腳本的 automation host)
  jumpbox:
    fqdn: dc01.home.lab
    ip:   10.0.0.200
    role: [ad, dns, jumpbox, automation]

  # 服務位址
  services:
    dns:    10.0.0.200
    ntp:    10.0.1.254
    syslog: 10.0.0.123
    gateway: 10.0.0.1
    netmask: 255.255.254.0             # /23

  # Offline VCF Software Depot (nginx HTTPS + basic auth; builder = vcf9offlinescript repo)
  offline_depot:
    fqdn: vcf9depotserver.home.lab
    ip:   10.0.0.61
    url:  https://vcf9depotserver.home.lab
    path: /PROD
    auth_user: vcfdepot                # 密碼在 secrets/
    cert_san: [ vcf9depotserver.home.lab, 10.0.0.61 ]   # 9.1 fleet 硬性要求 SAN 含 FQDN+IP
    ca_trust: "已用 add_trusted_certificate.py 匯進 VSP 平台 (KB 442978)"

# -------- VCF Management Domain (M02) --------------------------------------
vcf:
  management_domain:
    name: vcf-m02
    pool_name: vcf-m02-cl01-np01
    ceip_enabled: false
    vsan_esa: false

    vcf_installer: { hostname: vcf-m02-inst01, fqdn: vcf-m02-inst01.home.lab, ip: 10.0.1.4 }
    sddc_manager:  { hostname: vcf-m02-sddcm01, fqdn: vcf-m02-sddcm01.home.lab, ip: 10.0.1.18 }
    inner_vcenter: { hostname: vcf-m02-vc01,    fqdn: vcf-m02-vc01.home.lab,    ip: 10.0.1.19,
                     size: small, sso_domain: vsphere.local,
                     datacenter: vcf-m02-dc01, cluster: vcf-m02-cl01 }
    nsx_manager:
      vip_hostname:  vcf-m02-nsx01
      vip_fqdn:      vcf-m02-nsx01.home.lab
      vip_ip:        10.0.1.21
      node_hostname: vcf-m02-nsx01a
      node_fqdn:     vcf-m02-nsx01a.home.lab
      node_ip:       10.0.1.20
      size:          medium
      transport_vlan: 0

    # VCF Operations 三件套 (完整部署含這些)
    operations:    { hostname: vcf-m02-ops01,   fqdn: vcf-m02-ops01.home.lab,   ip: 10.0.1.22, size: small }
    fleet:         { hostname: vcf-m02-fleet01, fqdn: vcf-m02-fleet01.home.lab, ip: 10.0.1.23 }
    collector:     { hostname: vcf-m02-opsc01,  fqdn: vcf-m02-opsc01.home.lab,  ip: 10.0.1.24, size: small }

    # VCF 9.1 專屬元件 (Automation / VSP / VIDB / License) — IP 在 10.0.0.170-175
    automation:    { vip_fqdn: vcf-m02-auto-vip.home.lab,      vip_ip: 10.0.0.170,
                     platform_fqdn: vcf-m02-auto-platform.home.lab, platform_ip: 10.0.0.171, size: small }
    vsp:           { fqdn: vcf-m02-vsp01.home.lab,    ip: 10.0.0.172 }
    shared:        { fqdn: vcf-m02-shared01.home.lab, ip: 10.0.0.173 }
    vidb:          { fqdn: vcf-m02-vidb.home.lab,     ip: 10.0.0.174, size: small }   # VCF SSO → home.lab AD; vCenter/NSX/Ops/VCFA 四產品全接 vidb (2026-07)
    license:       { fqdn: vcf-m02-license.home.lab,  ip: 10.0.0.175 }
    hcx:           { fqdn: vcf-m02-hcx.home.lab,      ip: 10.0.1.26 }

    # VNA (VPC Network Appliance) — VPC gateway/NAT 服務 (NSX Policy API 部署)
    vna:           { hostname: vcf-m02-vna01, fqdn: vcf-m02-vna01.home.lab, ip: 10.0.0.181,
                     form_factor: SMALL, service: VPC_SERVICES, cluster: vna-cl01 }

    # VKS Supervisor — 2026-07 拉起, 走 VDS + Foundation Load Balancer (非 NSX VPC)
    supervisor:
      name:           vcf-m02-sup01
      cluster:        vcf-m02-cl01       # domain-c9
      status:         RUNNING
      networking:     VDS+FLB            # 非 NSX VPC (繞開 GatewayConnectionReady 死路)
      cp_mgmt_ips:    10.0.0.182-186     # SupervisorControlPlaneVM (mgmt)
      flb_ips:        10.0.0.187-188     # Foundation Load Balancer
      api_endpoint:   10.0.0.182
      k8s_services:   10.96.0.0/23
      images_library: supervisor-local   # Local Content Library (offline 匯入, 無 HTTP server)

# -------- Nested ESXi hosts (4 台 management domain) -----------------------
# name           = ESXi hostname / 外層 vCenter 上的 VM 名
# fqdn           = ESXi mgmt vmk FQDN (home.lab)
hosts:
  - { name: vcf-m02-esx01, fqdn: vcf-m02-esx01.home.lab, mgmt_ip: 10.0.1.14, vmotion_ip: 192.168.23.9,  vsan_ip: 192.168.24.9,  role: management }
  - { name: vcf-m02-esx02, fqdn: vcf-m02-esx02.home.lab, mgmt_ip: 10.0.1.15, vmotion_ip: 192.168.23.10, vsan_ip: 192.168.24.10, role: management }
  - { name: vcf-m02-esx03, fqdn: vcf-m02-esx03.home.lab, mgmt_ip: 10.0.1.16, vmotion_ip: 192.168.23.11, vsan_ip: 192.168.24.11, role: management }
  - { name: vcf-m02-esx04, fqdn: vcf-m02-esx04.home.lab, mgmt_ip: 10.0.1.17, vmotion_ip: 192.168.23.12, vsan_ip: 192.168.24.12, role: management }

# nested ESXi VM sizing (Deploy-NestedESXi-And-Installer.ps1 用)
nested_sizing:
  vcpu:          24
  memory_gb:     256
  cache_vdisk_gb:    100
  capacity_vdisk_gb: 1000

# -------- 網路 -------------------------------------------------------------
network:
  mgmt:    { cidr: 10.0.0.0/23,     gateway: 10.0.0.1,      vlan: 0 }   # mgmt untagged (照 5/13 spec)
  vmotion: { cidr: 192.168.23.0/24, gateway: 192.168.23.254, vlan: 13, range_start: 192.168.23.9, range_end: 192.168.23.12 }
  vsan:    { cidr: 192.168.24.0/24, gateway: 192.168.24.254, vlan: 14, range_start: 192.168.24.9, range_end: 192.168.24.12 }
  nsx_tep: { cidr: 192.168.29.0/24, gateway: 192.168.29.254, range_start: 192.168.29.9, range_end: 192.168.29.24 }
  workload: { cidr: 192.168.15.0/24, gateway: 192.168.15.254, vlan: 5, range_start: 192.168.15.32, range_end: 192.168.15.63 }  # Supervisor workload (RouterOS ether4); VS VIP 192.168.15.64-95

# -------- NSX VPC (VCF 9.1 native VPC networking; VNA + Distributed TGW) ---
#  Day0 骨架 bring-up 自建; VNA 掛在 connectivity profile 的 service_gateway.
#  租戶 VPC 對外靠 default SNAT → external block. (Supervisor 沒走這條, 走 VDS+FLB.)
nsx_vpc:
  project:               default
  transit_gateway:       { name: default, kind: Day0, transit_subnet: 100.64.0.0/21 }
  external_ip_block:     10.0.0.0/23        # Day0 External (visibility EXTERNAL; 租戶 SNAT 出口)
  private_tgw_ip_block:  172.31.0.0/16
  vpc_connectivity_profile: default         # service_gateway = vna-cl01, default SNAT on
  test_vpc:              { name: vpc-app01, private: 10.244.0.0/24, subnet_01: 10.244.0.0/26 }

# -------- DNS zones (Set-DnsRecords.ps1 用; 跑在 jumpbox/DNS = 10.0.0.200) --
dns:
  server: 10.0.0.200
  forward_zone: home.lab
  reverse_zones:                       # 對應 mgmt 段 (10.0.0.x / 10.0.1.x)
    - { zone: 0.0.10.in-addr.arpa, subnet: 10.0.0 }
    - { zone: 1.0.10.in-addr.arpa, subnet: 10.0.1 }

# -------- ISO / depot / OVA 檔位置 (放在 jumpbox E:\9.1) -------------------
artifacts:
  nested_esxi_ova:   E:/9.1/Nested_ESXi9.1.0.0_Appliance_Template_v1.0.ova
  vcf_installer_ova: E:/9.1/VCF-SDDC-Manager-Appliance-9.1.0.0.25371088.ova
  esxi_91_iso:       E:/9.1/VMware-VMvisor-Installer-9.1.0.0.25370933.x86_64.iso
  esxi_91_depot:     E:/9.1/VMware-ESXi-9.1.0.0.25370933-depot.zip

# -------- 遷移「來源端」(舊環境, 要遷到上面 VCFA 9 的那套) -------------------
#  ⚠ 這是 API 遷移專案的 SOURCE: vRA 8 / Aria Automation 8 + 配套 vIDM / vROps.
#     不屬於 M02 VCF 9.1 lab, 但在同一 home.lab / mgmt 網段, 一起記錄方便對照.
#     下列事實為 live 實測 (2026-07-01, 從 10.0.0.200 DNS 解析 + curl/requests 打通).
#     密碼放 inventory/secrets/lab.yaml 的 vra8 區塊 (見 lab.example.yaml).
migration_source:
  vra8:                                  # Aria Automation 8 (被遷移的舊 IaaS 平台)
    fqdn: vra.home.lab
    ip:   10.0.0.203
    user: configadmin                    # 內建本機管理帳號 (System Domain)
    product: "VMware Aria Automation 8 (vRA 8)"
    iaas_api_version: "2021-07-15"        # /iaas/api/about latestApiVersion (supported: 2019-01-15, 2021-07-15)
    # 舊登入: POST /csp/gateway/am/api/login {username,password} -> cspAuthToken (Bearer, ~1h)
    #   ★ 此端點在 VCF Automation 9 已移除 -> 改 OAuth /oauth/provider|tenant/<org>/token
    login_endpoint: /csp/gateway/am/api/login
    # live 盤點 (GET, 皆 HTTP 200):
    live_counts:
      projects: 2
      cloud_accounts: 1                  # labvc.lab.com
      zones: 1
      flavor_image_network_profiles: [1, 1, 1]
      fabric_networks: 29
      machines: 73
      deployments: 4
      catalog_items: 9
      catalog_types: 5
      blueprints: 6                      # -> VCF Automation 9 改為 Cloud Template
  vidm:                                  # vRA8 的認證來源 (Workspace ONE Access)
    fqdn: vidm.home.lab
    ip:   10.0.0.202
    product: "VMware Identity Manager / Workspace ONE Access"
    health: "GET /SAAS/API/1.0/REST/system/health -> HTTP 200"
  vrops:                                 # 舊監控 (對映到 VCF Operations 10.0.1.22)
    fqdn: vrops.home.lab
    ip:   10.0.0.111
    product: "vRealize Operations (舊)"
  # 對映到目標端 (見上方 vcf.management_domain):
  #   vra8   -> automation (vcf-m02-auto-vip.home.lab, 10.0.0.170)   認證改 OAuth
  #   vidm   -> VCF Identity Broker (內建於 VCFA 9)
  #   vrops  -> operations (vcf-m02-ops01.home.lab, 10.0.1.22)
