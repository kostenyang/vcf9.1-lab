# =============================================================================
#  Secrets 範本 — 這是「明文範例」, 真正的 lab.yaml 用 sops 加密過再 commit
#
#  使用方式:
#    cp inventory/secrets/lab.example.yaml inventory/secrets/lab.yaml
#    sops -e -i inventory/secrets/lab.yaml          # 加密成 git 安全的版本
#    sops inventory/secrets/lab.yaml                # 之後編輯都用這個
#
#  讀取方式 (在腳本裡):
#    source scripts/load-secrets.sh
#    echo "$ESXI_ROOT_PW"
# =============================================================================

esxi:
  root_pw: REPLACE_ME

outer_vcenter:
  sso_admin_pw: REPLACE_ME

inner_vcenter:
  sso_admin_pw: REPLACE_ME
  root_pw:      REPLACE_ME      # M02 vCenter root,layer1 deploy 用

sddc_manager:
  admin_pw: REPLACE_ME          # admin@local
  root_pw:  REPLACE_ME

# VCF Installer (Cloud Builder 的 9.1 取代品)
vcf_installer:
  admin_pw: REPLACE_ME          # admin@local
  root_pw:  REPLACE_ME

nsx:
  admin_pw: REPLACE_ME
  root_pw:  REPLACE_ME
  audit_pw: REPLACE_ME

# VCF Operations (vROps)
vcf_ops:
  root_pw:  REPLACE_ME
  admin_pw: REPLACE_ME

# VCF Operations Fleet Manager
vcf_fleet:
  root_pw:  REPLACE_ME
  admin_pw: REPLACE_ME

# VCF Operations Collector (Cloud Proxy)
vcf_collector:
  root_pw: REPLACE_ME

ad:
  domain_admin_user: lab\\administrator
  domain_admin_pw:   REPLACE_ME

# Lab Constructor / VCF Installer 預設給 management VM 的 root/admin 密碼
deploy_defaults:
  vm_root_pw: REPLACE_ME

# 遷移來源端: 舊 vRA 8 / Aria Automation 8 (見 inventory/lab.yaml migration_source)
vra8:
  configadmin_pw: REPLACE_ME     # POST /csp/gateway/am/api/login 的密碼 (configadmin)
